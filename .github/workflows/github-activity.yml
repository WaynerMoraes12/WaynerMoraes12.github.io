name: Atividade do GitHub

# Gera activity.json (feed "Direto do GitHub", contadores e competências automáticas)
# e publica na branch "activity-data", que o site lê direto. Assim o main não recebe
# um commit a cada atualização e o site não precisa ser republicado.
#
# Repositórios privados: só entram se existir o secret GH_PRIVATE_TOKEN. Deles o
# script publica apenas "commit/PR em repositório privado" com a data, sem nome,
# mensagem, arquivos ou link.
on:
  schedule:
    - cron: "*/5 * * * *"   # a cada 5 minutos (o GitHub pode atrasar alguns minutos)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/github_activity.py"
      - "data/tech-catalog.json"
      - "data/github-config.json"
      - ".github/workflows/github-activity.yml"

permissions:
  contents: write

concurrency:
  group: github-activity
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Recuperar o estado da última execução
        run: |
          mkdir -p out
          if git fetch --depth=1 origin activity-data 2>/dev/null; then
            git show FETCH_HEAD:github-state.json > out/github-state.json 2>/dev/null || true
            git show FETCH_HEAD:activity.json > out/previous.json 2>/dev/null || true
          elif [ -f data/github-state.json ]; then
            cp data/github-state.json out/github-state.json   # primeira vez: aproveita o estado que estava no main
          fi

      - name: Gerar atividade
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PRIVATE_TOKEN: ${{ secrets.GH_PRIVATE_TOKEN }}
          ACTIVITY_OUT: out
        run: python scripts/github_activity.py

      - name: Publicar na branch activity-data
        env:
          REPO: ${{ github.repository }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Só publica se algo além do horário mudou
          strip() { python -c "import json,sys; d=json.load(open(sys.argv[1])); d.pop('generated_at',None); print(json.dumps(d,sort_keys=True))" "$1"; }
          if [ -f out/previous.json ] && [ "$(strip out/previous.json)" = "$(strip out/activity.json)" ]; then
            AGE=$(python -c "import json,datetime as d; g=json.load(open('out/previous.json'))['generated_at']; print(int((d.datetime.now(d.timezone.utc)-d.datetime.fromisoformat(g)).total_seconds()))")
            # Mesmo sem novidade, renova a cada 30 min para o "atualizado há" não envelhecer
            if [ "$AGE" -lt 1800 ]; then echo "Nada novo."; exit 0; fi
          fi
          cd out && rm -f previous.json
          git init -q && git checkout -q -b activity-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add activity.json github-state.json
          git commit -q -m "Atividade do GitHub"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${REPO}.git" activity-data
